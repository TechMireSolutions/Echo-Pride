name: Echo Pride Live Deployment

on:
  push:
    branches:
      - main  # Agar branch ka naam master hai to yahan master kar dein

jobs:
  deploy:
    name: Build & Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 11092
          timeout: 120s
          script: |
            set -e
            echo "🚀 Deployment started on VPS..."

            # ----------------------------------------------------
            # 1. DIRECTORY & GIT FIXES
            # ----------------------------------------------------
            cd /www/wwwroot/echopride.store

            # Git safe directory permissions
            git config --global --add safe.directory /www/wwwroot/echopride.store

            # Remote URL ensure karein taake 'origin does not exist' ka error na aye
            git remote set-url origin https://github.com/TechMireSolutions/Echo-Pride.git 2>/dev/null || git remote add origin https://github.com/TechMireSolutions/Echo-Pride.git

            # Pull latest changes
            git fetch origin main
            git reset --hard origin/main

            # ----------------------------------------------------
            # 2. BACKEND SETUP (Node.js - Port 5005)
            # ----------------------------------------------------
            echo "⚙️ Setting up Node.js Backend..."
            cd /www/wwwroot/echopride.store/Backend
            npm install --production=false

            # Ensure Backend Port 5005
            if [ -f .env ]; then
              sed -i 's/PORT=.*/PORT=5005/g' .env
            else
              echo "PORT=5005" > .env
            fi

            # PM2 process reload/start
            if pm2 list | grep -q "echopride-backend"; then
              echo "🔄 Restarting echopride-backend..."
              pm2 restart echopride-backend --update-env
            else
              echo "▶️ Starting echopride-backend..."
              pm2 start server.js --name "echopride-backend"
            fi
            pm2 save

            # ----------------------------------------------------
            # 3. FRONTEND SETUP (echopridee - Vite React)
            # ----------------------------------------------------
            echo "📦 Building echopridee Frontend..."
            cd /www/wwwroot/echopride.store/echopridee
            npm install

            # Relative /api replace karein taake proxy se connect ho
            find src/ -type f \( -name "*.js" -o -name "*.jsx" -o -name "*.ts" -o -name "*.tsx" \) -exec sed -i 's|http://localhost:5005/api|/api|g' {} + 2>/dev/null || true
            find src/ -type f \( -name "*.js" -o -name "*.jsx" -o -name "*.ts" -o -name "*.tsx" \) -exec sed -i 's|http://localhost:5000/api|/api|g' {} + 2>/dev/null || true

            # Build Vite dist
            npm run build

            # ----------------------------------------------------
            # 4. NGINX RELOAD
            # ----------------------------------------------------
            echo "🔄 Reloading Nginx..."
            nginx -t && nginx -s reload

            echo "✅ Deployment successful! echopride.store is fully updated and live."
